# Not a package: this file only configures the dev tools (ruff, pytest).

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
# E/W: style errors, F: pyflakes (unused names, undefined vars), I: import order,
# B: bugbear (likely bugs), UP: pyupgrade (modern syntax), SIM: simplifications
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
